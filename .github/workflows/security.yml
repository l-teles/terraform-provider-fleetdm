name: Security

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Run weekly on Monday at 08:00 UTC to catch newly disclosed vulnerabilities
        - cron: "0 8 * * 1"

permissions:
    contents: read

jobs:
    govulncheck:
        name: govulncheck (dependency vulnerabilities)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
                async: true
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: ".github/security-tools/go.mod"
                  cache: true
            # Versions come from the `tool` directives (and go.sum) in
            # .github/security-tools/go.mod, so nothing is pinned here.
            - name: Run govulncheck
              run: go tool -modfile=.github/security-tools/go.mod govulncheck ./...
            # The tools module has no packages of its own, only tool directives,
            # so there is nothing for ./... to scan; build the tools it pins and
            # scan those binaries.
            - name: Run govulncheck on the security tools
              run: |
                  cd .github/security-tools
                  go build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
                  go tool govulncheck -mode=binary "$RUNNER_TEMP/gosec"

    gosec:
        name: gosec (SAST)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
                async: true
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: ".github/security-tools/go.mod"
                  cache: true
            - name: Run gosec
              run: go tool -modfile=.github/security-tools/go.mod gosec ./...

    zizmor:
        name: zizmor (GitHub Actions security)
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
                async: true
            - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

    scorecard:
        name: OpenSSF Scorecard
        runs-on: ubuntu-latest
        # Scorecard only supports push and schedule on the default branch
        if: github.event_name != 'pull_request'
        permissions:
            security-events: write
            id-token: write
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run OpenSSF Scorecard
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true
            - name: Upload Scorecard SARIF
              uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  sarif_file: results.sarif
