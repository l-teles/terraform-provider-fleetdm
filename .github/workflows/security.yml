name: Security

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Run weekly on Monday at 08:00 UTC to catch newly disclosed vulnerabilities
        - cron: "0 8 * * 1"

permissions:
    contents: read

jobs:
    govulncheck:
        name: govulncheck (dependency vulnerabilities)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@3a99261dae897b6a73b2d04d88cfc832a8f18f4b
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
                async: true
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: ".github/security-tools/go.mod"
                  cache: true
            - name: Install govulncheck
              run: cd .github/security-tools && go install golang.org/x/vuln/cmd/govulncheck
            - name: Run govulncheck
              run: govulncheck ./...

    gosec:
        name: gosec (SAST)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@3a99261dae897b6a73b2d04d88cfc832a8f18f4b
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
                async: true
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: ".github/security-tools/go.mod"
                  cache: true
            - name: Install gosec
              run: cd .github/security-tools && go install github.com/securego/gosec/v2/cmd/gosec
            - name: Run gosec
              run: gosec ./...

    zizmor:
        name: zizmor (GitHub Actions security)
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@3a99261dae897b6a73b2d04d88cfc832a8f18f4b
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
                async: true
            - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

    scorecard:
        name: OpenSSF Scorecard
        runs-on: ubuntu-latest
        # Scorecard only supports push and schedule on the default branch
        if: github.event_name != 'pull_request'
        permissions:
            security-events: write
            id-token: write
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run OpenSSF Scorecard
              uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true
            - name: Upload Scorecard SARIF
              uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
              with:
                  sarif_file: results.sarif
