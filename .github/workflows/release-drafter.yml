name: Release Drafter

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    update_release_draft:
        name: Update Release Draft
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Configure credentials
              uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
              with:
                api-token: ${{ secrets.SECURITY_API_TOKEN }}
                profile: admin
                profile-region: us-east-1
            - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
