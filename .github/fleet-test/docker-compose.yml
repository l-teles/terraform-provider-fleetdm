# Docker Compose for spinning up a Fleet test instance.
# Used by the CI acceptance-test workflow and for local development testing.
#
# All services use network_mode: "host" so that Fleet's --dev flag can reach
# the S3 store via localhost:9000 (as it expects) rather than a Docker bridge
# hostname.
#
# Usage:
#   docker compose -f .github/fleet-test/docker-compose.yml up -d --wait
#   eval "$(.github/fleet-test/setup-fleet.sh)"
#   TF_ACC=1 go test -v -cover ./internal/provider/...

services:
  mysql:
    image: mysql:8.0
    network_mode: "host"
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: insecure
    command: --max_allowed_packet=536870912
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "fleet", "-pinsecure"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    network_mode: "host"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 6

  # RustFS provides the S3-compatible storage Fleet --dev expects at
  # localhost:9000 — the same server Fleet's own dev compose uses. The
  # credentials must be exactly `locals3`/`locals3`: Fleet --dev hardcodes
  # them client-side (cmd/fleet/main.go) and auto-creates its buckets at
  # startup with them. MinIO can't take this role — it rejects root passwords
  # shorter than 8 characters, so Fleet's bucket auto-create fails and every
  # installer upload 403s. Test-only credentials for an ephemeral local store,
  # not a real secret.
  s3:
    image: rustfs/rustfs:1.0.0-alpha.85@sha256:23ff2af1ec2d64e0fb9608a1c39b5eb96fcff3a8efecf332986c948b0e3e4f8a
    network_mode: "host"
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: locals3
      RUSTFS_SECRET_KEY: locals3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  # One-shot generator of a self-signed WSTEP identity certificate. Any
  # cert/key pair lets Fleet turn on Windows MDM in this test rig, which
  # unlocks live configuration-profile CRUD in acceptance tests. The key must
  # be PKCS#1 ("RSA PRIVATE KEY") — Fleet's WSTEP depot rejects PKCS#8.
  mdm-certs:
    image: alpine/openssl:3.5.7@sha256:19f8eb9004a1dbaec323eed6094e9b6bcc1dbf2697ecb5fb8d2fad4e3336a8f7
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if [ ! -f /certs/wstep-cert.pem ] || [ ! -f /certs/wstep-key.pem ]; then
          openssl req -x509 -newkey rsa:2048 -keyout /certs/wstep-key-pkcs8.pem \
            -out /certs/wstep-cert.pem -days 365 -nodes -subj "/CN=Fleet Test WSTEP"
          openssl rsa -in /certs/wstep-key-pkcs8.pem -out /certs/wstep-key.pem -traditional
          rm /certs/wstep-key-pkcs8.pem
          # Throwaway test-only key: must be readable by the non-root fleet user.
          chmod 644 /certs/wstep-cert.pem /certs/wstep-key.pem
        fi
    volumes:
      - mdm-certs:/certs

  fleet-migrate:
    image: fleetdm/fleet:${FLEET_IMAGE_TAG:-v4.90.0}
    network_mode: "host"
    command: fleet prepare db
    environment:
      # host networking → all services reachable at 127.0.0.1
      FLEET_MYSQL_ADDRESS: 127.0.0.1:3306
      FLEET_MYSQL_USERNAME: fleet
      FLEET_MYSQL_PASSWORD: insecure
      FLEET_MYSQL_DATABASE: fleet
      FLEET_REDIS_ADDRESS: 127.0.0.1:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Exits 0 on success; compose treats it as a one-shot service.

  fleet:
    image: fleetdm/fleet:${FLEET_IMAGE_TAG:-v4.90.0}
    network_mode: "host"
    # --dev    : sets Fleet development defaults (logging, TLS cert, etc.)
    # --dev_license: enables Fleet Premium via the built-in development license
    command: fleet serve --dev --dev_license
    environment:
      FLEET_MYSQL_ADDRESS: 127.0.0.1:3306
      FLEET_MYSQL_USERNAME: fleet
      FLEET_MYSQL_PASSWORD: insecure
      FLEET_MYSQL_DATABASE: fleet
      FLEET_REDIS_ADDRESS: 127.0.0.1:6379
      FLEET_SERVER_ADDRESS: 0.0.0.0:8080
      # Override --dev's forced TLS so tests can connect over plain HTTP.
      FLEET_SERVER_TLS: "false"
      FLEET_LOGGING_JSON: "true"
      # Test-only encryption key (NOT a real secret): Fleet requires a server
      # private key (>= 32 bytes) to store certificate-authority credentials
      # and custom variables. This throwaway instance holds only fake test
      # fixtures, so a static value is fine here.
      FLEET_SERVER_PRIVATE_KEY: test-only-private-key-0123456789abcdef
      # Self-signed WSTEP identity (generated by the mdm-certs service) so
      # Windows MDM can be enabled; setup-fleet.sh turns it on via the API.
      FLEET_MDM_WINDOWS_WSTEP_IDENTITY_CERT: /certs/wstep-cert.pem
      FLEET_MDM_WINDOWS_WSTEP_IDENTITY_KEY: /certs/wstep-key.pem
    volumes:
      - mdm-certs:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      fleet-migrate:
        condition: service_completed_successfully
      mdm-certs:
        condition: service_completed_successfully
    # No healthcheck here: the Fleet image is a minimal binary that does not
    # ship curl/wget.  setup-fleet.sh polls /healthz from the runner instead.

volumes:
  mdm-certs:
